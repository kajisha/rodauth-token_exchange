# Reference topology. Render @PLACEHOLDERS@ before use; verify production settings.
# The backend must be reachable only through trusted ingress or enforce its own
# equivalent rate limit. This loopback listener is for the executable local probe.
worker_processes 2;
pid @DIRECTORY@/nginx.pid;
error_log @DIRECTORY@/error.log;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path @DIRECTORY@/body;
    proxy_temp_path @DIRECTORY@/proxy;
    fastcgi_temp_path @DIRECTORY@/fastcgi;
    uwsgi_temp_path @DIRECTORY@/uwsgi;
    scgi_temp_path @DIRECTORY@/scgi;
    # Shared by workers. Do not replace the key with supplied headers/credentials.
    limit_req_zone $binary_remote_addr zone=token_exchange:1m rate=5r/m;
    server {
        listen 127.0.0.1:@PORT@ ssl reuseport;
        ssl_certificate @DIRECTORY@/server.pem;
        ssl_certificate_key @DIRECTORY@/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        limit_req zone=token_exchange burst=4 nodelay;
        limit_req_status 429;
        # One location covers every route and alias; no unrestricted token path.
        location / {
            proxy_pass https://127.0.0.1:@UPSTREAM_PORT@;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate @DIRECTORY@/upstream-ca.pem;
            proxy_ssl_verify_depth 2;
            proxy_ssl_server_name on;
            proxy_ssl_name @UPSTREAM_NAME@;
            # Replace localhost with the deployment's fixed public authority.
            proxy_set_header Host localhost;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Scheme "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_set_header Front-End-Https "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
        }
    }
}
